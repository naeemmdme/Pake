name: Build App With Pake CLI (Custom Inject)

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.26.2"

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        required: true
        default: "windows-latest"
        type: choice
        options:
          - "windows-latest"
          - "macos-latest"
          - "ubuntu-24.04"
      url:
        description: "Website URL"
        required: true
      name:
        description: "App name (lowercase for Linux)"
        required: true
      icon:
        description: "Icon URL, auto-fetch if empty"
        required: false
      inject_css:
        description: "Custom CSS: https:// link OR file path inside this repo (e.g. inject/custom.css)"
        required: false
      inject_js:
        description: "Custom JS: https:// link OR file path inside this repo (e.g. inject/custom.js)"
        required: false
      width:
        description: "Window width (px)"
        required: false
        default: "1200"
      height:
        description: "Window height (px)"
        required: false
        default: "780"
      min_width:
        description: "Minimum window width (px)"
        required: false
      min_height:
        description: "Minimum window height (px)"
        required: false
      app_version:
        description: "App version"
        required: false
        default: "1.0.0"
      fullscreen:
        description: "Start in fullscreen mode"
        required: false
        type: boolean
        default: false
      hide_title_bar:
        description: "Hide title bar (macOS only)"
        required: false
        type: boolean
        default: false
      new_window:
        description: "Allow sites to open new windows"
        required: false
        type: boolean
        default: false
      multi_arch:
        description: "Universal binary (macOS only)"
        required: false
        type: boolean
        default: false
      targets:
        description: "Package formats (comma-separated: deb,appimage,rpm,zst)"
        required: false
        default: "deb"

# Builds an app on demand for anyone who runs it; it writes nothing.
permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.platform }}
    runs-on: ${{ inputs.platform }}
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare inject files
        shell: bash
        env:
          INPUT_INJECT_CSS: ${{ inputs.inject_css }}
          INPUT_INJECT_JS: ${{ inputs.inject_js }}
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/pake-inject"
          mkdir -p "$DEST"

          # Convert a bash path to something Node understands (matters on Windows).
          to_native() {
            if command -v cygpath >/dev/null 2>&1; then cygpath -m "$1"; else echo "$1"; fi
          }

          # $1 = input value, $2 = expected extension (css|js), $3 = env var to export
          prepare() {
            local src="$1" ext="$2" var="$3"
            [ -z "$src" ] && return 0

            local out="$DEST/custom.$ext"
            if [[ "$src" =~ ^https?:// ]]; then
              echo "Downloading $ext from URL..."
              curl -fsSL --retry 3 --max-time 60 "$src" -o "$out"
            else
              # Repo-relative file; must stay inside the checkout.
              local full
              full="$(realpath -m "$GITHUB_WORKSPACE/$src")"
              case "$full" in
                "$GITHUB_WORKSPACE"/*) ;;
                *) echo "::error::$src is outside the repository"; exit 1 ;;
              esac
              if [ ! -f "$full" ]; then
                echo "::error::File not found in repo: $src"
                exit 1
              fi
              cp "$full" "$out"
            fi

            if [ ! -s "$out" ]; then
              echo "::error::Inject $ext file is empty: $src"
              exit 1
            fi
            echo "Prepared $ext inject ($(wc -c < "$out") bytes)"
            echo "$var=$(to_native "$out")" >> "$GITHUB_ENV"
          }

          prepare "$INPUT_INJECT_CSS" css INJECT_CSS_FILE
          prepare "$INPUT_INJECT_JS" js INJECT_JS_FILE

      - name: Setup Node.js Environment
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build CLI
        run: pnpm run cli:build

      - name: Setup mold linker
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Build App (Linux/macOS)
        if: runner.os != 'Windows'
        timeout-minutes: 25
        shell: bash
        env:
          INPUT_URL: ${{ inputs.url }}
          INPUT_NAME: ${{ inputs.name }}
          INPUT_ICON: ${{ inputs.icon }}
          INPUT_WIDTH: ${{ inputs.width }}
          INPUT_HEIGHT: ${{ inputs.height }}
          INPUT_MIN_WIDTH: ${{ inputs.min_width }}
          INPUT_MIN_HEIGHT: ${{ inputs.min_height }}
          INPUT_APP_VERSION: ${{ inputs.app_version }}
          INPUT_FULLSCREEN: ${{ inputs.fullscreen }}
          INPUT_HIDE_TITLE_BAR: ${{ inputs.hide_title_bar }}
          INPUT_NEW_WINDOW: ${{ inputs.new_window }}
          INPUT_MULTI_ARCH: ${{ inputs.multi_arch }}
          INPUT_TARGETS: ${{ inputs.targets }}
        run: |
          ARGS=("$INPUT_URL" "--name" "$INPUT_NAME")

          if [ -n "$INPUT_ICON" ]; then
            ARGS+=("--icon" "$INPUT_ICON")
          fi

          if [ -n "${INJECT_CSS_FILE:-}" ]; then
            ARGS+=("--inject" "$INJECT_CSS_FILE")
          fi

          if [ -n "${INJECT_JS_FILE:-}" ]; then
            ARGS+=("--inject" "$INJECT_JS_FILE")
          fi

          if [ -n "$INPUT_WIDTH" ]; then
            ARGS+=("--width" "$INPUT_WIDTH")
          fi

          if [ -n "$INPUT_HEIGHT" ]; then
            ARGS+=("--height" "$INPUT_HEIGHT")
          fi

          if [ -n "$INPUT_MIN_WIDTH" ]; then
            ARGS+=("--min-width" "$INPUT_MIN_WIDTH")
          fi

          if [ -n "$INPUT_MIN_HEIGHT" ]; then
            ARGS+=("--min-height" "$INPUT_MIN_HEIGHT")
          fi

          if [ -n "$INPUT_APP_VERSION" ]; then
            ARGS+=("--app-version" "$INPUT_APP_VERSION")
          fi

          if [ "$INPUT_FULLSCREEN" == "true" ]; then
            ARGS+=("--fullscreen")
          fi

          if [ "$INPUT_HIDE_TITLE_BAR" == "true" ]; then
            ARGS+=("--hide-title-bar")
          fi

          if [ "$INPUT_NEW_WINDOW" == "true" ]; then
            ARGS+=("--new-window")
          fi

          if [ "$INPUT_MULTI_ARCH" == "true" ]; then
            ARGS+=("--multi-arch")
          fi

          if [ -n "$INPUT_TARGETS" ] && [ "$RUNNER_OS" == "Linux" ]; then
            ARGS+=("--targets" "$INPUT_TARGETS")
          fi

          printf 'Running: node dist/cli.js'
          printf ' %q' "${ARGS[@]}"
          printf '\n'
          node dist/cli.js "${ARGS[@]}"

      - name: Build App (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 25
        shell: pwsh
        env:
          INPUT_URL: ${{ inputs.url }}
          INPUT_NAME: ${{ inputs.name }}
          INPUT_ICON: ${{ inputs.icon }}
          INPUT_WIDTH: ${{ inputs.width }}
          INPUT_HEIGHT: ${{ inputs.height }}
          INPUT_MIN_WIDTH: ${{ inputs.min_width }}
          INPUT_MIN_HEIGHT: ${{ inputs.min_height }}
          INPUT_APP_VERSION: ${{ inputs.app_version }}
          INPUT_FULLSCREEN: ${{ inputs.fullscreen }}
          INPUT_HIDE_TITLE_BAR: ${{ inputs.hide_title_bar }}
          INPUT_NEW_WINDOW: ${{ inputs.new_window }}
          INPUT_MULTI_ARCH: ${{ inputs.multi_arch }}
          INPUT_TARGETS: ${{ inputs.targets }}
        run: |
          $args = $env:INPUT_URL, "--name", $env:INPUT_NAME

          # Empty environment variables are unset on Windows, so test for null too.
          if (-not [string]::IsNullOrEmpty($env:INPUT_ICON)) {
            $args += "--icon", $env:INPUT_ICON
          }

          if (-not [string]::IsNullOrEmpty($env:INJECT_CSS_FILE)) {
            $args += "--inject", $env:INJECT_CSS_FILE
          }

          if (-not [string]::IsNullOrEmpty($env:INJECT_JS_FILE)) {
            $args += "--inject", $env:INJECT_JS_FILE
          }

          if (-not [string]::IsNullOrEmpty($env:INPUT_WIDTH)) {
            $args += "--width", $env:INPUT_WIDTH
          }

          if (-not [string]::IsNullOrEmpty($env:INPUT_HEIGHT)) {
            $args += "--height", $env:INPUT_HEIGHT
          }

          if (-not [string]::IsNullOrEmpty($env:INPUT_MIN_WIDTH)) {
            $args += "--min-width", $env:INPUT_MIN_WIDTH
          }

          if (-not [string]::IsNullOrEmpty($env:INPUT_MIN_HEIGHT)) {
            $args += "--min-height", $env:INPUT_MIN_HEIGHT
          }

          if (-not [string]::IsNullOrEmpty($env:INPUT_APP_VERSION)) {
            $args += "--app-version", $env:INPUT_APP_VERSION
          }

          if ($env:INPUT_FULLSCREEN -eq "true") {
            $args += "--fullscreen"
          }

          if ($env:INPUT_HIDE_TITLE_BAR -eq "true") {
            $args += "--hide-title-bar"
          }

          if ($env:INPUT_NEW_WINDOW -eq "true") {
            $args += "--new-window"
          }

          Write-Host "Running: node dist/cli.js $($args -join ' ')"
          node dist/cli.js $args

          git checkout -- src-tauri/Cargo.lock

      - name: Upload DMG (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-macOS
          path: ${{ inputs.name }}.dmg
          retention-days: 3

      # The CLI lowercases and hyphenates Linux names, so match packages by extension.
      - name: Upload DEB (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Linux-deb
          path: "*.deb"
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload AppImage (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Linux-AppImage
          path: "*.AppImage"
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload RPM (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Linux-rpm
          path: "*.rpm"
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload ZST (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Linux-zst
          path: "*.pkg.tar.zst"
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload MSI (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Windows
          path: ${{ inputs.name }}.msi
          retention-days: 3
